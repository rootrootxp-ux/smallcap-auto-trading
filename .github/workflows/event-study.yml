name: Short Event Study (saved data)

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'research/event_study/**'
      - 'research/__init__.py'
      - 'tests/**'
      - 'watchlist.csv'
      - 'requirements.txt'
      - 'docs/event_study.md'
      - '.github/workflows/event-study.yml'

permissions:
  contents: read

jobs:
  event-study:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Tokyo
      PYTHONHASHSEED: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies for the full test suite
        run: python -m pip install -r requirements.txt
      - name: Automated tests (including synthetic event data)
        run: python -m unittest discover -s tests -v
      - name: Descriptive event study with committed prices
        run: python -u -m research.event_study
      - name: Validate artifact hashes, timing, matching, and return arithmetic
        run: python -m research.event_study.check
      - name: Downloadable event-study report and CSV
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: event-study-${{ github.run_id }}-${{ github.run_attempt }}
          path: results/event_study/
          if-no-files-found: warn
          retention-days: 14
