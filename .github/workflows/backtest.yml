name: Backtest v3
on:
  workflow_dispatch:
    inputs:
      validation_mode:
        description: 'standard＝通常実行、fixed_conditions＝固定条件・別期間・新旧品質処理の比較'
        type: choice
        default: standard
        options:
          - standard
          - fixed_conditions
      fee_yen:
        description: '仮定費用の片道固定手数料（円、実料金ではありません）'
        default: '100'
        required: true
        type: string
      fee_bps:
        description: '仮定費用の片道従量手数料（bps）'
        default: '0'
        required: true
        type: string
      annual_interest_pct:
        description: '仮定年利（%、同日も最低1日/365）'
        default: '3'
        required: true
        type: string
permissions:
  contents: read
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Asia/Tokyo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Automated tests (synthetic data)
        run: python -m unittest discover -s tests -v
      - name: Fixed conditions, separate period, and causal quality comparison
        if: inputs.validation_mode == 'fixed_conditions'
        run: python -u -m research.run_fixed
      - name: Validate frozen experiment artifacts
        if: inputs.validation_mode == 'fixed_conditions'
        run: python -m research.check_artifact
      - name: Backtest with Yahoo Finance data
        if: inputs.validation_mode == 'standard'
        env:
          FEE_YEN: ${{ inputs.fee_yen }}
          FEE_BPS: ${{ inputs.fee_bps }}
          ANNUAL_INTEREST_PCT: ${{ inputs.annual_interest_pct }}
        run: >-
          python -u smallcap_auto_v3.py
          --fee-yen "$FEE_YEN"
          --fee-bps "$FEE_BPS"
          --annual-interest-pct "$ANNUAL_INTEREST_PCT"
      - name: Validate backtest outputs
        if: inputs.validation_mode == 'standard'
        run: python scripts/check_results.py
      - name: Downloadable reports and CSV
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backtest-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ inputs.validation_mode == 'fixed_conditions' && 'results/fixed_validation/' || 'results/' }}
          if-no-files-found: warn
          retention-days: 14
