name: Backtest v3
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Asia/Tokyo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Automated tests (synthetic data)
        run: python -m unittest discover -s tests -v
      - name: Backtest with Yahoo Finance data
        run: python -u smallcap_auto_v3.py
      - name: Validate backtest outputs
        run: python scripts/check_results.py
      - name: Downloadable reports and CSV
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backtest-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: results/
          if-no-files-found: warn
          retention-days: 14
